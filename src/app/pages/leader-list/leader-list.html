<div class="list-page">
  <div class="header-row">
    <div>
      <h2>Gym Leaders Directory</h2>
      <p>Official registry records</p>
    </div>

    <div class="filter-controls">
      <button type="button" [class.active]="selectedRegion() === 'All'" (click)="setRegion('All')">All</button>
      <button type="button" [class.active]="selectedRegion() === 'Kanto'" (click)="setRegion('Kanto')">Kanto</button>
      <button type="button" [class.active]="selectedRegion() === 'Johto'" (click)="setRegion('Johto')">Johto</button>
      <button type="button" [class.active]="selectedRegion() === 'Hoenn'" (click)="setRegion('Hoenn')">Hoenn</button>
    </div>
  </div>

  <div class="cards-grid">
    @for (leader of filteredLeaders(); track leader._id) {
      <app-leader-card
        [leader]="leader"
        (edit)="onEdit($event)"
        (remove)="onRemove($event)"
      />
    } @empty {
      <div class="empty-state">
        <p>No Gym Leaders registered yet.</p>
      </div>
    }
  </div>
</div>
