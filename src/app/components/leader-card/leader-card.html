<div class="card" [class]="leader().region.toLowerCase()">
  <!-- Card Header -->
  <div class="card-top">
    <div class="card-title">
      <h3>{{ leader().name }}</h3>
      <span class="town-badge">{{ leader().town }}</span>
    </div>
    <span class="region-tag">{{ leader().region }}</span>
  </div>

  <div class="card-body">
    <div class="meta-row">
      <span class="meta-label">SPECIALTY</span>
      <span class="meta-value">{{ leader().specialty }}</span>
    </div>
    <div class="meta-row">
      <span class="meta-label">BADGE</span>
      <span class="meta-value">{{ leader().badge }}</span>
    </div>
    <div class="meta-row">
      <span class="meta-label">ACE LEVEL</span>
      <span class="meta-value level-badge">Lv. {{ leader().aceLevel }}</span>
    </div>

    @if (leader().motto) {
      <p class="motto-text">"{{ leader().motto }}"</p>
    }
  </div>

  <div class="card-actions">
    <button type="button" class="btn-edit" (click)="onEdit()">Edit</button>
    <button type="button" class="btn-delete" (click)="onRemove()">Retire</button>
  </div>
</div>
